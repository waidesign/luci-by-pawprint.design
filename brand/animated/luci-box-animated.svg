nd" stroke-linejoin="round"/><path d="M30 112 L48 115" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 125 L49 125" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 112 L152 115" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M167 125 L151 125" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g><path class="luci-muzzle" d="M78 130 C78 118 92 114 100 121 C108 114 122 118 122 130 C122 147 110 154 100 154 C90 154 78 147 78 130 Z" fill="#FDF9F6"/><g class="luci-brows"><path d="M60 88 L82 92" fill="none" stroke="#AD4F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 86 Q130 78 142 82" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-eye luci-eye-l"><g transform="rotate(8 73 104)"><clipPath id="boxe1"><path d="M58 104 Q73 83 88 104 Q73 125 58 104 Z"/></clipPath><path d="M58 104 Q73 83 88 104 Q73 125 58 104 Z" fill="#CBB042"/><g class="luci-pupil"><ellipse cx="68" cy="104" rx="2.6" ry="8.5" fill="#2B2B2B"/><circle cx="72" cy="101" r="2.2" fill="#FFFFFF"/></g><g clip-path="url(#boxe1)"><rect x="56" y="90" width="34" height="15.099999999999994" fill="#F6A24F"/><path d="M57 106.1 Q73 108.1 89 104.1" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M58 104 Q73 83 88 104 Q73 125 58 104 Z" fill="none" stroke="#2B2B2B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></g></g><g class="luci-eye luci-eye-r"><g transform="rotate(-8 127 104)"><clipPath id="boxe2"><path d="M112 104 Q127 83 142 104 Q127 125 112 104 Z"/></clipPath><path d="M112 104 Q127 83 142 104 Q127 125 112 104 Z" fill="#CBB042"/><g class="luci-pupil"><ellipse cx="122" cy="104" rx="2.6" ry="8.5" fill="#2B2B2B"/><circle cx="126" cy="101" r="2.2" fill="#FFFFFF"/></g><g clip-path="url(#boxe2)"><rect x="110" y="90" width="34" height="15.099999999999994" fill="#F6A24F"/><path d="M111 106.1 Q127 108.1 143 104.1" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M112 104 Q127 83 142 104 Q127 125 112 104 Z" fill="none" stroke="#2B2B2B" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></g></g><path class="luci-nose" d="M92 117 L108 117 Q104 124 100 127 Q96 124 92 117 Z" fill="#E79993" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/><g class="luci-mouth"><path d="M100 127 L100 133" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 137 L108 137" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-whiskers"><path d="M76 130 L34 124" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 130 L166 124" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 136 L34 141" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 136 L166 141" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="luci-box"><path d="M30 168 L210 168 L200 252 L40 252 Z" fill="#FCD7AA" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 168 L8 140 L56 140 L74 168 Z" fill="#FEEBD1" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 168 L232 140 L184 140 L166 168 Z" fill="#FEEBD1" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(120 212)"><ellipse cx="0" cy="6" rx="9" ry="7" fill="#2B2B2B"/><circle cx="-11" cy="-4" r="4" fill="#2B2B2B"/><circle cx="-