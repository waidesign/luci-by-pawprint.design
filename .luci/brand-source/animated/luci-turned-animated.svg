<svg xmlns="http://www.w3.org/2000/svg" class="luci luci-pose-turned" viewBox="-14 -14 268 292" width="536" height="584" role="img" aria-label="Luci the cat, turned"><style>/* Luci mascot animations. Works on the layered SVGs (inline) or inside the animated SVG files. */
.luci .luci-ear,.luci .luci-eye,.luci .luci-tail,.luci .luci-body,.luci .luci-head,.luci .luci-z,.luci .luci-pupil,.luci .luci-arm,.luci .luci-ruler-line{transform-box:fill-box}
.luci .luci-ear-l{transform-origin:70% 100%}
.luci .luci-ear-r{transform-origin:30% 100%}
.luci .luci-eye{transform-origin:50% 50%}
.luci .luci-body{transform-origin:50% 100%}
.luci .luci-head{transform-origin:50% 85%}
.luci .luci-tail-wrap{transform-origin:92% 20%}
.luci .luci-tail-up{transform-origin:5% 95%}
.luci .luci-arm{transform-origin:10% 90%}
.luci .luci-z{transform-origin:50% 50%}

@keyframes luci-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes luci-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes luci-slowblink{0%,25%{transform:scaleY(1)}42%,68%{transform:scaleY(.08)}85%,100%{transform:scaleY(1)}}
@keyframes luci-twitch{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-12deg)}92%{transform:rotate(5deg)}95%{transform:rotate(-6deg)}98%{transform:rotate(0)}}
@keyframes luci-sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes luci-lash{0%{transform:rotate(-9deg)}100%{transform:rotate(9deg)}}
@keyframes luci-look{0%,18%{transform:translateX(0)}30%,50%{transform:translateX(-4px)}62%,82%{transform:translateX(4px)}94%,100%{transform:translateX(0)}}
@keyframes luci-z{0%{opacity:0;transform:translate(0,6px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-20px) scale(1.1)}}
@keyframes luci-tap{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes luci-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes luci-tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes luci-bristle{0%{transform:rotate(-2deg)}100%{transform:rotate(2deg)}}

/* Idle: sitting tall */
.luci-pose-sit .luci-body{animation:luci-breathe 4.5s ease-in-out infinite}
.luci-pose-sit .luci-eye{animation:luci-blink 6s ease-in-out infinite}
.luci-pose-sit .luci-ear-r{animation:luci-twitch 7s ease-in-out infinite}
.luci-pose-sit .luci-tail{animation:luci-sway 5s ease-in-out infinite}
/* Hello: slow blink (add class luci-hello to the sitting pose) */
.luci-hello .luci-eye{animation:luci-slowblink 5s ease-in-out infinite}
.luci-hello .luci-head{animation:luci-tilt 5s ease-in-out infinite}
/* Avatar head */
.luci-pose-head .luci-eye{animation:luci-blink 6s ease-in-out infinite}
.luci-pose-head .luci-ear-l{animation:luci-twitch 8s ease-in-out infinite 2s}
/* Watching (empty state) */
.luci-pose-peek .luci-pupil{animation:luci-look 7s ease-in-out infinite}
.luci-pose-peek .luci-eye{animation:luci-blink 7s ease-in-out infinite 3s}
.luci-pose-peek .luci-ear-l{animation:luci-twitch 6s ease-in-out infinite 1s}
/* Measuring (spacing tool) */
.luci-pose-measure .luci-ruler-line{animation:luci-pulse 1.6s ease-in-out infinite}
.luci-pose-measure .luci-arm{animation:luci-tap 1.6s ease-in-out infinite}
.luci-pose-measure .luci-eye{animation:luci-blink 5s ease-in-out infinite}
/* In the box (capture basket) */
.luci-pose-box .luci-eye{animation:luci-blink 6s ease-in-out infinite}
.luci-pose-box .luci-pupil{animation:luci-look 9s ease-in-out infinite 1s}
.luci-pose-box .luci-ear-r{animation:luci-twitch 5s ease-in-out infinite}
/* Asleep (loading) */
.luci-pose-sleep .luci-body{animation:luci-breathe 3.5s ease-in-out infinite}
.luci-pose-sleep .luci-z1{animation:luci-z 3s ease-out infinite}
.luci-pose-sleep .luci-z2{animation:luci-z 3s ease-out infinite 1.5s}
/* Content (success) */
.luci-pose-content .luci-body{animation:luci-breathe 4s ease-in-out infinite}
.luci-pose-content .luci-tail{animation:luci-sway 6s ease-in-out infinite}
.luci-pose-content .luci-ear-r{animation:luci-twitch 6s ease-in-out infinite 2s}
/* Annoyed (error) */
.luci-pose-annoyed .luci-tail{animation:luci-lash .9s ease-in-out infinite alternate}
.luci-pose-annoyed .luci-ear{animation:luci-bristle .35s ease-in-out infinite alternate}
.luci-pose-annoyed .luci-body{animation:luci-breathe 1.8s ease-in-out infinite}
/* Turned away (not now) */
.luci-pose-turned .luci-tail{animation:luci-sway 4s ease-in-out infinite}
.luci-pose-turned .luci-ear-r{animation:luci-twitch 5s ease-in-out infinite}
.luci-pose-turned .luci-head{animation:luci-tilt 6s ease-in-out infinite}

/* Tool poses: Pressing, Reading, Swatch, Comparing, Noting, Arranging, Placing, Sketching */
.luci .luci-button-cap,.luci .luci-highlight,.luci .luci-chip-lift,.luci .luci-tick,.luci .luci-marker,.luci .luci-select-box,.luci .luci-block,.luci .luci-draft{transform-box:fill-box}
.luci .luci-highlight{transform-origin:0 50%}
.luci .luci-tick{transform-origin:50% 50%}
.luci .luci-select-box{transform-origin:0 100%}

@keyframes luci-press{0%,100%{transform:translateY(3px)}50%{transform:translateY(0)}}
@keyframes luci-select{0%{transform:scaleX(.05);opacity:1}45%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes luci-scan{0%,15%{transform:translateX(-3px)}50%,65%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
@keyframes luci-lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes luci-glance{0%,40%{transform:translateX(-3px)}50%,90%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
@keyframes luci-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes luci-drop{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}35%,85%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes luci-resize{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes luci-settle{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes luci-push{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}

/* Pressing (Component tool) */
.luci-pose-press .luci-arm{animation:luci-tap 1.6s ease-in-out infinite}
.luci-pose-press .luci-button-cap{animation:luci-press 1.6s ease-in-out infinite}
.luci-pose-press .luci-click{animation:luci-pulse 1.6s ease-in-out infinite}
.luci-pose-press .luci-eye{animation:luci-blink 5s ease-in-out infinite}
/* Reading (Text tool) */
.luci-pose-read .luci-highlight{animation:luci-select 3.2s ease-in-out infinite}
.luci-pose-read .luci-pupil{animation:luci-scan 3.2s ease-in-out infinite}
.luci-pose-read .luci-eye{animation:luci-blink 6s ease-in-out infinite 2s}
/* Swatch (Colour tool) */
.luci-pose-swatch .luci-chip-lift{animation:luci-lift 2s ease-in-out infinite}
.luci-pose-swatch .luci-arm{animation:luci-tap 2s ease-in-out infinite}
.luci-pose-swatch .luci-eye{animation:luci-blink 6s ease-in-out infinite}
/* Comparing (Check) */
.luci-pose-compare .luci-pupil{animation:luci-glance 4s ease-in-out infinite}
.luci-pose-compare .luci-tick{animation:luci-pop 4s ease-in-out infinite}
.luci-pose-compare .luci-head{animation:luci-tilt 6s ease-in-out infinite}
.luci-pose-compare .luci-tail{animation:luci-sway 5s ease-in-out infinite}
/* Noting (Feedback: Annotate) */
.luci-pose-note .luci-marker{animation:luci-drop 3s ease-out infinite}
.luci-pose-note .luci-arm{animation:luci-tap 3s ease-in-out infinite}
.luci-pose-note .luci-eye{animation:luci-blink 6s ease-in-out infinite 1s}
/* Arranging (Layout: Select) */
.luci-pose-arrange .luci-select-box{animation:luci-resize 2.4s ease-in-out infinite}
.luci-pose-arrange .luci-ear-r{animation:luci-twitch 6s ease-in-out infinite}
.luci-pose-arrange .luci-eye{animation:luci-blink 5s ease-in-out infinite}
/* Placing (Layout: Insert) */
.luci-pose-place .luci-block{animation:luci-settle 2s ease-in-out infinite}
.luci-pose-place .luci-arm{animation:luci-push 2s ease-in-out infinite}
.luci-pose-place .luci-arrow{animation:luci-pulse 2s ease-in-out infinite}
/* Sketching (Layout: New page) */
.luci-pose-sketch .luci-draft{animation:luci-pulse 2.4s ease-in-out infinite}
.luci-pose-sketch .luci-arm{animation:luci-tap 1.2s ease-in-out infinite}
.luci-pose-sketch .luci-eye{animation:luci-blink 6s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){.luci *{animation:none!important}}
</style><g class="luci-body"><path d="M78 166 C60 196 58 232 68 246 L172 246 C182 232 180 196 162 166 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 176 L120 236" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 182 L96 236" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 182 L144 236" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 196 L76 230" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 196 L164 230" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-paws"><ellipse cx="70" cy="244" rx="17" ry="8" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="170" cy="244" rx="17" ry="8" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="luci-tail luci-tail-up"><path d="M168 236 C200 236 214 214 206 184 C203 172 192 174 194 186 C198 204 190 220 166 222 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 214 L190 208 M206 196 L194 196" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-collar"><rect x="84.0" y="174" width="72" height="12" rx="6" fill="#B4D43C" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(20 0)"><g class="luci-head"><g class="luci-ear luci-ear-r"><g><path d="M162 98 L151 26 Q148 18 141 23 L104 60 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M146 22 L149 11 M146 22 L144 12" fill="none" stroke="#2B2B2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="luci-ear luci-ear-l"><g><path d="M38 98 L49 26 Q52 18 59 23 L96 60 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M54 22 L51 11 M54 22 L56 12" fill="none" stroke="#2B2B2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></g><path class="luci-face" d="M100 54 C140 54 166 72 169 104 L180 114 L169 121 L178 133 L163 139 L168 152 L149 156 C136 170 118 176 100 176 C82 176 64 170 51 156 L32 152 L37 139 L22 133 L31 121 L20 114 L31 104 C34 72 60 54 100 54 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><g class="luci-stripes"><path d="M100 58 L100 96" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 60 L86 94" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 60 L114 94" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 70 L72 100" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 70 L128 100" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M54 90 L60 116" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M146 90 L140 116" fill="none" stroke="#D86D1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>