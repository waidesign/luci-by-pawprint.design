cap="round" stroke-linejoin="round"/><path d="M54 22 L51 11 M54 22 L56 12" fill="none" stroke="#2B2B2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></g><path class="luci-face" d="M100 54 C140 54 166 72 169 104 L180 114 L169 121 L178 133 L163 139 L168 152 L149 156 C136 170 118 176 100 176 C82 176 64 170 51 156 L32 152 L37 139 L22 133 L31 121 L20 114 L31 104 C34 72 60 54 100 54 Z" fill="#F6A24F" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><g class="luci-stripes"><path d="M100 58 L100 80" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M87 60 L91 78" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 60 L109 78" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 66 L81 79" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 66 L119 79" fill="none" stroke="#D86D1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 112 L48 115" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 125 L49 125" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 112 L152 115" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M167 125 L151 125" fill="none" stroke="#D86D1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g><path class="luci-muzzle" d="M78 130 C78 118 92 114 100 121 C108 114 122 118 122 130 C122 147 110 154 100 154 C90 154 78 147 78 130 Z" fill="#FDF9F6"/><g class="luci-brows"><path d="M60 86 L82 92" fill="none" stroke="#AD4F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 86 L118 92" fill="none" stroke="#AD4F1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-eye luci-eye-l"><g transform="rotate(8 73 104)"><path d="M59 106 Q73 111 87 106" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="luci-eye luci-eye-r"><g transform="rotate(-8 127 104)"><path d="M113 106 Q127 111 141 106" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><path class="luci-nose" d="M92 117 L108 117 Q104 124 100 127 Q96 124 92 117 Z" fill="#E79993" stroke="#2B2B2B" stroke-width="3" stroke-linejoin="round"/><g class="luci-mouth"><path d="M100 127 L100 133" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M91 137 Q96 136 100 133 Q104 136 109 137" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="luci-whiskers"><path d="M76 130 L34 124" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 130 L166 124" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 136 L34 141" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M124 136 L166 141" fill="none" stroke="#2B2B2B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="luci-zz"><text class="luci-z luci-z1" x="172" y="118" font-family="ui-rounded, Nunito, system-ui, sans-serif" font-weight="800" font-size="26" fill="#2B2B2B">z</text><text class="luci-z luci-z2" x="194" y="92" font-family="ui-rounded, Nunito, system-ui, sans-serif" font-weight="800" font-size="34" fill="#2B2B2B">z</text></g></svg>