<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traps</title>
<!-- Elements that navigate the way real sites do, to prove the picker never lets the page react.
     Every pointer, mouse and click event the page receives is counted. -->
<style>
  body { margin: 0; padding: 32px; font: 16px/24px system-ui, sans-serif; color: #18181b; }
  .row { display: flex; gap: 16px; margin-bottom: 24px; }
  .cta { display: inline-block; padding: 12px 24px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font: 600 16px/24px system-ui, sans-serif; text-decoration: none; }
  .scroller { height: 120px; overflow: auto; border: 1px solid #e4e4e7; padding: 8px; }
  .scroller p { margin: 0 0 80px; }
</style>
</head>
<body>
  <div class="row">
    <a id="press-link" class="cta" href="/gone?via=link">Navigates on press</a>
    <button id="window-click" class="cta" type="button">Window-level click</button>
    <form action="/gone" method="get"><button id="submit" class="cta" type="submit">Submit form</button></form>
    <button id="tap" class="cta" type="button">Navigates on pointer-up</button>
  </div>
  <div class="scroller" id="scroller"><p>One</p><p>Two</p><p>Three</p><p id="deep">Four</p></div>
  <script>
    window.pageEvents = [];
    for (const type of ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'auxclick', 'contextmenu']) {
      window.addEventListener(type, e => { window.pageEvents.push(`${type}:${e.target.id || e.target.tagName}`); }, true);
    }
    const go = () => { location.href = '/gone'; };
    document.getElementById('press-link').addEventListener('mousedown', go);
    window.addEventListener('click', e => { if (e.target.closest && e.target.closest('#window-click')) go(); }, true);
    document.getElementById('tap').addEventListener('pointerup', go);
  </script>
</body>
</html>
