<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive</title>
  <!--
    Responsive capture (v0.3.4). The pricing section has two breakpoints, 768px and 1024px: below
    768px one column, 48px 16px padding, a 28px heading and no description; from 768px two columns,
    96px 24px padding, a 40px heading and the description; from 1024px three columns. The nav link
    has one, a max-width query: 16px text with 12px 16px padding below 1024px, 14px above.
    The print and prefers-reduced-motion queries style nothing here that a width changes.
  -->
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #161616; }
    header nav { display: flex; gap: 16px; padding: 16px; }
    header nav a { color: #161616; font-size: 14px; text-decoration: none; }
    @media (max-width: 1023px) { header nav a { font-size: 16px; padding: 12px 16px; } }
    #pricing { padding: 48px 16px; background: #f4f4f4; }
    #pricing h2 { margin: 0; font-size: 28px; }
    #pricing .lead { display: none; font-size: 18px; }
    #pricing .plans { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 24px; }
    #pricing .plan { padding: 24px; background: #ffffff; border-radius: 12px; }
    @media (min-width: 768px) {
      #pricing { padding: 96px 24px; }
      #pricing h2 { font-size: 40px; }
      #pricing .lead { display: block; }
      #pricing .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) { #pricing .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media print { #pricing { background: none; } }
    @media (prefers-reduced-motion: reduce) { #pricing .plan { transition: none; } }
  </style>
</head>
<body>
  <header><nav><a href="#" id="home-link">Home</a><a href="#">Pricing</a><a href="#">Docs</a></nav></header>
  <main>
    <section id="pricing">
      <h2>Pricing</h2>
      <p class="lead">Pick the plan that fits your team.</p>
      <div class="plans">
        <div class="plan"><h3>Free</h3><p>For one person.</p></div>
        <div class="plan"><h3>Team</h3><p>For small teams.</p></div>
        <div class="plan"><h3>Business</h3><p>For companies.</p></div>
      </div>
    </section>
  </main>
</body>
</html>
