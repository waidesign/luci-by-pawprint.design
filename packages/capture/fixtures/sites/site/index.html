<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <!--
    Multi-page system merge (v0.3.3): this page and blog.html are two pages of one site. They share
    the body text, the text color and 8px / 16px spacing; they differ in h2 (28px 700 here, 32px 600
    there), in --brand (#0f62fe here, #0043ce there) and in one spacing value (24px here, 32px there).
  -->
  <style>
    :root { --brand: #0f62fe; --text: #161616; }
    body { margin: 0; font-family: Arial, sans-serif; color: var(--text); background: #ffffff; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 700; }
    h2 { margin: 0; font-size: 28px; line-height: 36px; font-weight: 700; }
    p { margin: 0; font-size: 16px; line-height: 24px; }
    .card { padding: 24px; border: 1px solid #e0e0e0; }
    a { color: var(--brand); margin: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Home</h1>
    <section class="card"><h2>Plans</h2><p>Pick a plan that fits your team.</p><a href="#">See plans</a></section>
    <section class="card"><h2>Stories</h2><p>Teams that ship with us.</p><a href="#">Read stories</a></section>
  </main>
</body>
</html>
