<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing section fixture</title>
<style>
  :root { --space-2: 8px; --space-4: 16px; --space-6: 24px; --space-12: 48px; --brand: #0f62fe; --ink: #161616; --muted: #525252; --radius: 12px; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: #ffffff; }
  header.site { padding: var(--space-4) var(--space-6); border-bottom: 1px solid #e0e0e0; }
  #pricing { display: grid; gap: var(--space-12); padding: 96px var(--space-6); background: #f4f4f4; text-align: center; }
  #pricing .intro { max-width: 640px; margin: 0 auto; }
  #pricing h2 { margin: 0 0 var(--space-4); font-size: 40px; line-height: 48px; font-weight: 700; }
  #pricing .intro p { margin: 0; font-size: 18px; line-height: 28px; color: var(--muted); }
  .plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); max-width: 1080px; margin: 0 auto; }
  .plan { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-6); background: #ffffff; border: 1px solid #e0e0e0; border-radius: var(--radius); text-align: left; transition: box-shadow 0.2s ease; }
  .plan:hover { box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); }
  .plan.featured { background: var(--ink); color: #ffffff; border-color: var(--ink); }
  .plan h3 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
  .plan .price { margin: 0; font-size: 36px; line-height: 44px; font-weight: 700; }
  .plan ul { margin: 0; padding-left: 20px; }
  .badge { align-self: flex-start; padding: 2px 10px; border-radius: 999px; background: var(--brand); color: #ffffff; font-size: 12px; line-height: 20px; font-weight: 600; }
  .plan button { padding: 12px 20px; border: 0; border-radius: 8px; background: var(--brand); color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; }
  .plan button:hover { background: #0353e9; }
  .plan button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .note { margin: 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <header class="site"><strong>Fixture</strong></header>
  <section id="pricing">
    <div class="intro">
      <h2>Simple pricing</h2>
      <p>Start free. Upgrade when your team grows.</p>
    </div>
    <div class="plans">
      <div class="plan">
        <h3>Starter</h3>
        <p class="price">$0</p>
        <ul><li>One project</li><li>Community help</li></ul>
        <button type="button">Start free</button>
      </div>
      <div class="plan featured">
        <span class="badge">Most popular</span>
        <h3>Pro</h3>
        <p class="price">$12</p>
        <ul><li>Unlimited projects</li><li>Email help</li></ul>
        <button type="button">Start trial</button>
      </div>
      <div class="plan">
        <h3>Team</h3>
        <p class="price">$40</p>
        <ul><li>Everything in Pro</li><li>Admin controls</li></ul>
        <button type="button">Talk to sales</button>
      </div>
    </div>
    <p class="note">Prices in US dollars, per month.</p>
  </section>
</body>
</html>
