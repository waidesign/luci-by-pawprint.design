<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Box</title>
<!-- A fictional demo page for Luci's store screenshots. Every value goes through a CSS custom property. -->
<style>
  :root {
    --font-sans: "Segoe UI", Roboto, sans-serif; --font-mono: "Cascadia Code", monospace;
    --color-bg: #ffffff; --color-surface: #f4f4f4; --color-text: #161616; --color-muted: #525252; --color-border: #e0e0e0;
    --color-primary: #0f62fe; --color-primary-hover: #0353e9; --color-primary-active: #002d9c;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
    --text-sm: 14px; --text-md: 16px; --text-2xl: 32px;
  }
  body { margin: 0; font-family: var(--font-sans); color: var(--color-text); background-color: var(--color-bg); }
  header { display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) var(--space-8); border-bottom: 1px solid var(--color-border); }
  header a { font-size: var(--text-sm); line-height: 20px; color: var(--color-text); }
  nav { display: flex; gap: var(--space-6); }
  main { padding: var(--space-12) var(--space-8); }
  h1 { margin: var(--space-12) 0 0; font-size: clamp(2rem, 2rem + 2vw, 3rem); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
  .lead { margin: var(--space-6) 0 0; font-size: var(--text-md); line-height: 24px; color: var(--color-muted); }
  .plans { margin: var(--space-12) 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
  .card { padding: var(--space-6); border: 1px solid var(--color-border); }
  .card h2 { margin: 0; font-size: var(--text-2xl); line-height: 40px; font-weight: 600; }
  .card p { margin: var(--space-2) 0 0; font-size: var(--text-sm); line-height: 20px; color: var(--color-muted); }
  /* The Start button: hover, focus-visible, active and disabled styles for "States in this file" */
  .button { display: inline-block; margin-top: var(--space-6); padding: var(--space-3) var(--space-6); background-color: var(--color-primary); color: var(--color-bg); font-size: var(--text-sm); line-height: 20px; font-weight: 600; text-decoration: none; transition: background-color 150ms ease-out; }
  .button:hover { background-color: var(--color-primary-hover); }
  .button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .button:active { background-color: var(--color-primary-active); }
  .button[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
  .fine { margin: var(--space-6) 0 0; font-size: 12px; line-height: 16px; color: var(--color-muted); }
  code { font-family: var(--font-mono); font-size: 12px; }
  footer { padding: var(--space-8); background-color: var(--color-surface); }
  small { font-size: 12px; line-height: 16px; color: var(--color-muted); }
</style>
</head>
<body>
  <header><a href="/">Recipe Box</a><nav><a href="/plans">Plans</a><a href="/docs">Docs</a></nav></header>
  <main>
    <h1>Plans for every kitchen</h1>
    <p class="lead">Pick the plan that fits how often you cook.</p>
    <ul class="plans">
      <li class="card"><h2>Free</h2><p>For trying it out</p><a href="/start" class="button">Start</a></li>
      <li class="card"><h2>Home</h2><p>For weekly meal plans</p><a href="/start" class="button">Start</a></li>
      <li class="card"><h2>Family</h2><p>For four or more</p><a href="/start" class="button">Start</a></li>
    </ul>
    <p class="fine">Prices in <code>EUR</code>.</p>
  </main>
  <footer><small>Recipe Box is a demo page.</small></footer>
</body>
</html>
