name: Feature request
description: Suggest something Luci could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working in Luci. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
